name: Docker Publish

# Builds and pushes the three app images into ONE Docker Hub repo (waleedzafar68/emaigrator)
# whenever a version tag is pushed:
#   git tag -a vX.Y.Z && git push origin vX.Y.Z
# Tag scheme (service-prefixed, since the repo is shared):
#   api-vX.Y.Z    api-vX.Y    api-latest
#   workers-vX.Y.Z ...        workers-latest
#   web-vX.Y.Z    ...         web-latest
# NOTE: flavor latest=false is REQUIRED — the default would let all three matrix jobs fight
# over a meaningless plain :latest on the shared repo.
# Multi-arch (amd64 + arm64) — the Dockerfiles cross-compile on the native builder, so no slow
# QEMU-emulated .NET builds.
# Requires ONE repo secret: DOCKERHUB_TOKEN (a Docker Hub access token with Read & Write scope).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: deploy/Dockerfile.api
          - name: workers
            dockerfile: deploy/Dockerfile.workers
          - name: web
            dockerfile: deploy/Dockerfile.web
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: waleedzafar68
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/waleedzafar68/emaigrator
          flavor: |
            latest=false
          tags: |
            type=semver,pattern=v{{version}},prefix=${{ matrix.name }}-
            type=semver,pattern=v{{major}}.{{minor}},prefix=${{ matrix.name }}-
            type=raw,value=${{ matrix.name }}-latest
      - name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.name }}
