name: CodeQL

# CodeQL is a periodic security scan, not a per-commit gate. Running it on every push
# and every PR (incl. each Dependabot PR) was the single biggest Actions-minute drain
# (~7 min x 2 languages per event). Keep the weekly scan + on-demand dispatch; drop the
# push/PR triggers. Re-add `pull_request:` here if you later require CodeQL on PRs.
on:
  schedule:
    - cron: "27 3 * * 1" # weekly, Monday 03:27 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.3
        with:
          category: "/language:${{ matrix.language }}"
