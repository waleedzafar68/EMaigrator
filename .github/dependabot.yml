version: 2
updates:
  # .NET (NuGet) — central package management lives in src/Directory.Packages.props
  - package-ecosystem: nuget
    directory: /src
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dotnet-minor-patch:
        update-types: [minor, patch]

  # Frontend (npm)
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
