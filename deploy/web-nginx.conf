# Serves the EMaigrator SPA and reverse-proxies the API + SignalR hub to the `api` service so the
# browser only ever talks to ONE origin. That keeps everything same-origin: the SPA's CSP
# (connect-src 'self') is satisfied, no CORS is triggered, and the API's HttpOnly/SameSite=Strict
# auth cookie round-trips normally.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history-mode fallback: unknown paths return index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API. No trailing slash on proxy_pass → the original /api/v1/... path is preserved.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR hub — needs the WebSocket upgrade headers and a long read timeout for the live stream.
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
