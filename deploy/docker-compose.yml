name: emaigrator

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emaigrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emaigrator}
      POSTGRES_DB: ${POSTGRES_DB:-emaigrator}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emaigrator}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-emaigrator}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-emaigrator}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    # Keys map to what the app binds: AddInfrastructure reads the `Infrastructure:` section; the API's
    # own MassTransit bus reads `Infrastructure:RabbitMqConnectionString`; the SignalR backplane reads
    # `Redis:Configuration`. `__` is the .NET config section separator.
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Infrastructure__PostgresConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-emaigrator};Username=${POSTGRES_USER:-emaigrator};Password=${POSTGRES_PASSWORD:-emaigrator}
      Infrastructure__RedisConnectionString: redis:6379
      Infrastructure__RabbitMqConnectionString: amqp://${RABBITMQ_USER:-emaigrator}:${RABBITMQ_PASSWORD:-emaigrator}@rabbitmq:5672
      Redis__Configuration: redis:6379
      # Dev defaults — OVERRIDE IN PRODUCTION. The secret master key MUST be identical on api + workers
      # (the api wraps provider credentials; the workers unwrap them). CORS origins for a browser SPA
      # must be supplied via Cors__AllowedOrigins__0 etc.
      Infrastructure__SecretStore__Mode: LocalKey
      Infrastructure__SecretStore__KeyRef: ${SECRET_MASTER_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-emaigrator-dev-signing-key-change-me-in-production-0123456789}
      # SPA origin allowed by the CORS policy (AllowCredentials → explicit origins, no wildcard). The
      # in-compose `web` service proxies same-origin, but this lets a cross-origin SPA (e.g. the Vite dev
      # server) negotiate the SignalR hub without a "CORS policy execution failed" rejection.
      Cors__AllowedOrigins__0: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  workers:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.workers
    # AddInfrastructure reads the `Infrastructure:` section, but the Workers bus reads its broker from
    # `ConnectionStrings:RabbitMq` (a different key than the API's bus). The secret master key MUST match
    # the api service so wrapped provider credentials can be unwrapped here.
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Production}
      Infrastructure__PostgresConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-emaigrator};Username=${POSTGRES_USER:-emaigrator};Password=${POSTGRES_PASSWORD:-emaigrator}
      Infrastructure__RedisConnectionString: redis:6379
      Infrastructure__RabbitMqConnectionString: amqp://${RABBITMQ_USER:-emaigrator}:${RABBITMQ_PASSWORD:-emaigrator}@rabbitmq:5672
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER:-emaigrator}:${RABBITMQ_PASSWORD:-emaigrator}@rabbitmq:5672
      Infrastructure__SecretStore__Mode: LocalKey
      Infrastructure__SecretStore__KeyRef: ${SECRET_MASTER_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    # nginx serves the built SPA and reverse-proxies /api + /hubs to the api service, so the browser
    # talks to a single origin (no CORS/CSP/cross-origin-cookie issues). Open the app at this port.
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  pgdata:
  rabbitdata:
  redisdata:
