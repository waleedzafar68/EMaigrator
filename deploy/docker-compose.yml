name: ${COMPOSE_PROJECT_NAME:-emaigrator}

# Single, fully-parameterized stack: Postgres + RabbitMQ + Redis + API + workers + web UI.
# Everything an environment needs to change — published host ports, image tags, credentials, secrets,
# restart policy — is an env var with a safe default, so NO -f override files are needed. To customise,
# copy deploy/.env.example to deploy/.env and edit, then:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
# (Compose also auto-loads deploy/.env when you run from the deploy/ directory.) Internal service-to-service
# traffic uses container DNS (postgres:5432, redis:6379, rabbitmq:5672) and is unaffected by host-port remaps.

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17}
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emaigrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emaigrator}
      POSTGRES_DB: ${POSTGRES_DB:-emaigrator}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emaigrator}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4-management}
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-emaigrator}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-emaigrator}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:8}
    restart: ${RESTART_POLICY:-unless-stopped}
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # Published images live in ONE Docker Hub repo, service-prefixed tags (pushed by
    # .github/workflows/docker-publish.yml on each v* tag): emaigrator:api-vX.Y.Z / api-latest.
    # With both `image:` and `build:` present, a cloned repo still builds from source by
    # default; `docker compose pull` (or removing build:) uses the published image instead.
    image: ${API_IMAGE:-waleedzafar68/emaigrator:api-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: ${RESTART_POLICY:-unless-stopped}
    # Keys map to what the app binds: AddInfrastructure reads the `Infrastructure:` section; the API's
    # own MassTransit bus reads `Infrastructure:RabbitMqConnectionString`; the SignalR backplane reads
    # `Redis:Configuration`. `__` is the .NET config section separator. The host:port values below are the
    # in-network CONTAINER ports (service DNS) and are deliberately NOT the published *_PORT host vars.
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Infrastructure__PostgresConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-emaigrator};Username=${POSTGRES_USER:-emaigrator};Password=${POSTGRES_PASSWORD:-emaigrator}
      Infrastructure__RedisConnectionString: redis:6379
      Infrastructure__RabbitMqConnectionString: amqp://${RABBITMQ_USER:-emaigrator}:${RABBITMQ_PASSWORD:-emaigrator}@rabbitmq:5672
      Redis__Configuration: redis:6379
      # Dev defaults — OVERRIDE IN PRODUCTION via deploy/.env. The secret master key MUST be identical on
      # api + workers (the api wraps provider credentials; the workers unwrap them).
      Infrastructure__SecretStore__Mode: ${SECRET_STORE_MODE:-LocalKey}
      Infrastructure__SecretStore__KeyRef: ${SECRET_MASTER_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-emaigrator-dev-signing-key-change-me-in-production-0123456789}
      # SPA origin allowed by the CORS policy (AllowCredentials → explicit origins, no wildcard). The
      # in-compose `web` service proxies same-origin, but this lets a cross-origin SPA (e.g. the Vite dev
      # server) negotiate the SignalR hub. Defaults to the published web port.
      Cors__AllowedOrigins__0: ${WEB_ORIGIN:-http://localhost:${WEB_PORT:-3000}}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  workers:
    image: ${WORKERS_IMAGE:-waleedzafar68/emaigrator:workers-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.workers
    restart: ${RESTART_POLICY:-unless-stopped}
    # AddInfrastructure reads the `Infrastructure:` section, but the Workers bus reads its broker from
    # `ConnectionStrings:RabbitMq` (a different key than the API's bus). The secret master key MUST match
    # the api service so wrapped provider credentials can be unwrapped here.
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Production}
      Infrastructure__PostgresConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-emaigrator};Username=${POSTGRES_USER:-emaigrator};Password=${POSTGRES_PASSWORD:-emaigrator}
      Infrastructure__RedisConnectionString: redis:6379
      Infrastructure__RabbitMqConnectionString: amqp://${RABBITMQ_USER:-emaigrator}:${RABBITMQ_PASSWORD:-emaigrator}@rabbitmq:5672
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER:-emaigrator}:${RABBITMQ_PASSWORD:-emaigrator}@rabbitmq:5672
      Infrastructure__SecretStore__Mode: ${SECRET_STORE_MODE:-LocalKey}
      Infrastructure__SecretStore__KeyRef: ${SECRET_MASTER_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-waleedzafar68/emaigrator:web-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: ${RESTART_POLICY:-unless-stopped}
    # nginx serves the built SPA and reverse-proxies /api + /hubs to the api service, so the browser
    # talks to a single origin (no CORS/CSP/cross-origin-cookie issues). Open the app at this port.
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  pgdata:
  rabbitdata:
  redisdata:
