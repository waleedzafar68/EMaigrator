# Local host-port overlay — avoids clashing with another stack already bound to 5432/6379.
# Internal service-to-service traffic is unaffected (containers use service DNS: postgres:5432, redis:6379).
# `!override` REPLACES the base ports list (Compose merges sequences by appending otherwise).
# Use with: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ports.yml up -d
services:
  postgres:
    ports: !override
      - "5433:5432"
  redis:
    ports: !override
      - "6380:6379"
